[package]
name = "yamusic-radio-player"
version = "0.1.0"
description = "Tray player for the yamusic-radio DJ radio"
authors = ["vm86"]
license = "MIT"
edition = "2024"

[lib]
name = "yamusic_radio_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.2"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
symphonia = { version = "0.6", features = ["mp3", "flac", "ogg", "vorbis"] }
ureq = "3"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The same crate rodio plays through: with this feature it talks to PipeWire itself, and falls back to
# ALSA where there is no PipeWire.
cpal = { version = "0.18", features = ["pipewire"] }
