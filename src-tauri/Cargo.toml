[package]
name = "yamusic-radio-player"
version = "0.1.0"
description = "Tray player for the yamusic-radio DJ radio"
authors = ["vm86"]
edition = "2024"

[lib]
name = "yamusic_radio_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
tauri-plugin-dialog = "2.8.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
