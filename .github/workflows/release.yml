# Builds the app (macOS arm64: .dmg; Linux x86_64: .rpm and .deb) with the radio
# daemon and ffmpeg inside. Every run builds and keeps the packages as artifacts;
# a GitHub release is made ONLY by pushing a tag like v1.2.3.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The daemon comes from vm86/yamusic-radio (the branch main, or the repository
# variable YAMUSIC_RADIO_REF: a branch, a tag or a commit).
name: build

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

env:
  YAMUSIC_RADIO_REF: ${{ vars.YAMUSIC_RADIO_REF || 'main' }}

jobs:
  macos:
    name: macOS (arm64)
    # macOS 15 and Python 3.14: the wheel of Essentia for them has a good SDL2 and FFmpeg 8. The one
    # for Python 3.12 is old and aborts when it loads (it looks for SDL2), the daemon would not start.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.py "$GITHUB_REF_NAME"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-macos-arm64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-arm64-
      - name: Cache ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - run: npm ci
      - name: Daemon
        run: scripts/build-backend.sh
      - name: ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh
      - name: App
        run: npx tauri build --bundles dmg --config src-tauri/tauri.bundle.conf.json

      - name: Collect
        run: |
          version="$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          mkdir -p pkgs
          cp src-tauri/target/release/bundle/dmg/*.dmg "pkgs/yamusic-radio-player_${version}_aarch64.dmg"
          git -C build/backend/src rev-parse HEAD > pkgs/backend-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: pkgs/*
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    # Not the newest: the daemon and ffmpeg are built here, and they run on
    # systems that have the glibc of this one, or a newer one.
    # 24.04: the PipeWire of 22.04 is older than the 0.3.53 the audio crate needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm curl file patchelf libatomic1 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libssl-dev libayatana-appindicator3-dev libasound2-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/set-version.py "$GITHUB_REF_NAME"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-linux-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-linux-x86_64-
      - name: Cache ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-linux-x86_64-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - run: npm ci
      - name: Daemon
        run: scripts/build-backend.sh
      - name: ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh
      - name: App
        run: npx tauri build --bundles deb,rpm --config src-tauri/tauri.bundle.conf.json

      - name: Collect
        run: |
          version="$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          mkdir -p pkgs
          cp src-tauri/target/release/bundle/deb/*.deb "pkgs/yamusic-radio-player_${version}_amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "pkgs/yamusic-radio-player-${version}-1.x86_64.rpm"
          git -C build/backend/src rev-parse HEAD > pkgs/backend-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: pkgs/*
          if-no-files-found: error

  release:
    name: Release
    # Only a pushed tag makes a release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pkgs
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pkgs
          ls -la
          backend="$(cat backend-commit.txt)"
          rm backend-commit.txt
          # Only the packages: no folder, nothing else that may have got here.
          sha256sum -- *.dmg *.rpm *.deb > SHA256SUMS
          flags=()
          # v1.2.3-rc1 and the like are pre-releases.
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Radio daemon: [vm86/yamusic-radio@${backend:0:7}](https://github.com/vm86/yamusic-radio/commit/${backend}). ffmpeg 9.0.2 and LAME 4.0 (LGPL) are inside." \
            "${flags[@]}" -- *.dmg *.rpm *.deb SHA256SUMS
