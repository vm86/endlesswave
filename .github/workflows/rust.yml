# Tests of the Rust core (crates/radio-core). The answers of the original Python radio are committed
# (crates/radio-core/tests/golden/**/*.json). The big signals they were made from are not in git and are not made here
# (the Python radio is not used any more): the tests that need them say so and are skipped.
name: radio-core

on:
  push:
    branches: [main]
    paths: ["crates/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # the encoder tests run ffmpeg with libmp3lame
      - name: ffmpeg
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ffmpeg; else brew install ffmpeg; fi
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/radio-core/target
          key: cargo-radio-core-${{ matrix.os }}-${{ hashFiles('crates/radio-core/Cargo.toml', 'crates/radio-core/native/**') }}
      - name: Tests, with the simpler key and the ebur128 crate
        working-directory: crates/radio-core
        run: cargo test --locked
      # Essentia (C++) is built from source by build.rs: a few minutes.
      - name: Essentia and Eigen
        working-directory: crates/radio-core
        run: tools/fetch-vendor.sh
      - name: Tests, with Essentia
        working-directory: crates/radio-core
        run: cargo test --locked --features essentia
