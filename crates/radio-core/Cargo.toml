[package]
name = "radio-core"
version = "0.1.0"
description = "The mix of EndlessWave: analysis of tracks, blends, the queue, the streams"
authors = ["vm86"]
license = "AGPL-3.0-or-later"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bytes = { version = "1.12.1", default-features = false }
ebur128 = "0.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
indexmap = "2.14.2"
rand = "0.10.3"
rand_distr = "0.6.0"
realfft = "3.5.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1.53.3", features = ["rt", "sync", "process", "io-util", "macros", "time", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = "0.3.23"

[build-dependencies]
cc = { version = "1.8.0", optional = true }

[features]
# The key and the loudness by Essentia (AGPL-3.0, built from vendor/essentia by build.rs), as the Python radio finds
# them. Without it a simpler key detection and the ebur128 crate do it.
essentia = ["dep:cc"]
