[package]
name = "radio-core"
version = "0.1.0"
description = "The mix of EndlessWave: analysis of tracks, blends, the queue, the streams"
authors = ["vm86"]
license = "AGPL-3.0-or-later"
edition = "2024"
publish = false

[dependencies]
bytes = { version = "1.12.1", default-features = false }
ebur128 = "0.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rand = "0.10.3"
rand_distr = "0.6.0"
realfft = "3.5.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt", "sync", "process", "io-util", "macros", "time"] }

[dev-dependencies]
sha1 = "0.10"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "sync"] }

[build-dependencies]
cc = { version = "1.8.0", optional = true }

[features]
# The key and the loudness by Essentia (AGPL-3.0, built from vendor/essentia by build.rs), as the Python radio finds
# them. Without it a simpler key detection and the ebur128 crate do it.
essentia = ["dep:cc"]
